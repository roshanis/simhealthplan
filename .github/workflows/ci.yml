name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# pipeline and app are two independent top-level jobs with no `needs:`
# between them, so GitHub Actions runs them in parallel and a failure in
# one never cancels or blocks the other (the "fail-fast off" job
# separation this workflow is meant to have -- `fail-fast` only has a
# literal on/off knob under a matrix `strategy:`, which neither job uses).
jobs:
  pipeline:
    name: Pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Run pipeline tests
        # No OPENAI_API_KEY is set here: LLM-pass tests skip/no-op cleanly
        # without one. Most tests needing real downloaded/interim data
        # (marked `integration`, or with their own `pytest.skip` guards,
        # e.g. test_export_drift.py) skip cleanly when that data is absent
        # -- see pyproject.toml's `integration` marker and each test
        # module's docstring. NOTE: one exception is currently known --
        # tests/test_backtest_baselines.py::test_real_cpsc_2023_ingest_and_parse_or_documented_unavailable
        # does a real (uncached) network call to CMS and only treats
        # RuntimeError/OSError as "documented unavailable"; if the runner
        # has no route to cms.gov and that surfaces as some other
        # exception type (e.g. a proxying layer's own error class), this
        # step fails on that test rather than skipping.
        run: cd pipeline && uv run pytest

  app:
    name: App (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run app tests
        # Includes app/tests/parity.test.ts, the TypeScript side of the
        # Python<->TypeScript golden-parity check: it reads the committed
        # shared/golden/parity_fixture.json (generated by
        # pipeline/export/golden_fixture.py / `make golden`, see
        # pipeline/tests/test_golden_parity.py for the Python side) and
        # replays every fixture case through the TS choice-model port.
        run: cd app && npm test -- --run

      - name: Build app
        run: cd app && npm run build

# Everything above runs keyless: no secrets or API keys are configured or
# required. The pipeline's LLM persona pass (`make personas`) and the app's
# live-LLM route both no-op/skip gracefully without OPENAI_API_KEY (see
# app/.env.example, pipeline/.env.example), and no CI job sets one.

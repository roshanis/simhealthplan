[project]
name = "simhealthplan-pipeline"
version = "0.1.0"
description = "Medicare Advantage plan-choice simulator — data ETL and simulation pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.30",
    "openpyxl>=3.1",
    "pyarrow>=25.0.0",
    "beautifulsoup4>=4.15.0",
    "xlrd>=2.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires real downloaded artifacts in data/raw_cache; skips cleanly when absent",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "ingest",
    "parse",
    "archetypes",
    "choice_model",
    "llm",
    "backtest",
    "export",
]
